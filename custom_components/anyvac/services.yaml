  fields:
    entity_id:
      name: Vacuum
      description: Vacuum whose dock to command. Omit if `duid` is given instead.
      selector:
        entity:
          domain: vacuum
    duid:
      name: Vacuum (duid)
      description: Roborock device id, as an alternative to `entity_id`.
      selector:
        text:

