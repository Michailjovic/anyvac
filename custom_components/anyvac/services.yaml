clean:
  name: Clean
  description: >-
    Send a clean intent (rooms + mode) to the AnyVac planner. The backend
    resolves capability, load-balances rooms across capable vacuums (LPT),
    resolves per-room pins, and runs the resulting job server-side
    (dry -> wet gating, repeat, mop settings). This is the service the card's
    Start button calls.
  fields:
    rooms:
      name: Rooms
      description: >-
        Room names to clean, as configured in the Roborock app (not HA area
        names).
      required: true
      example: '["Kitchen", "Bedroom"]'
      selector:
        object:
    mode:
      name: Mode
      description: Which pass(es) to run.
      default: dry
      selector:
        select:
          options:
            - dry
            - wet
            - both
    vacuums:
      name: Vacuums
      description: >-
        Restrict which vacuums may be used. Either a flat list of vacuum
        entity_ids/duids (applies to both passes), or an object with
        separate `dry`/`wet` lists. Omit to allow every vacuum the
        integration knows about.
      example: '{"dry": ["vacuum.s6_kitchen"], "wet": ["vacuum.s8_maxv_ultra"]}'
      selector:
        object:
    pin:
      name: Pin override
      description: >-
        Per-call override of the stored room pins (see `anyvac.pin_room`).
        Object keyed by room name, each value an object with optional
        `dry`/`wet` vacuum entity_id/duid. Rooms not listed here fall back
        to the stored pins, then to automatic assignment.
      example: '{"Bedroom": {"dry": "vacuum.s6_kitchen"}}'
      selector:
        object:
    settings:
      name: Settings
      description: >-
        Per-vacuum, per-pass mop/fan settings — object keyed by `dry`/`wet`,
        each value an object keyed by vacuum entity_id/duid with that
        vacuum's own `fan_speed`/`mop_mode`/`mop_intensity`/`repeat`. Each
        vacuum doing a pass keeps its own settings; a vacuum with no entry
        for a pass it's assigned to just runs it with firmware defaults.
      example: '{"wet": {"vacuum.s8_maxv_ultra": {"mop_intensity": "high", "repeat": 2}}}'
      selector:
        object:

plan:
  name: Plan (preview)
  description: >-
    Same planner as `anyvac.clean`, but response-only — returns the
    assignment/ETA preview without starting anything. Used by the card for
    the live plan preview; also useful from automations/scripts that just
    want to inspect the plan.
  fields:
    rooms:
      name: Rooms
      description: >-
        Room names to plan, as configured in the Roborock app.
      required: true
      example: '["Kitchen", "Bedroom"]'
      selector:
        object:
    mode:
      name: Mode
      description: Which pass(es) to plan.
      default: dry
      selector:
        select:
          options:
            - dry
            - wet
            - both
    vacuums:
      name: Vacuums
      description: >-
        Restrict which vacuums may be used — same shape as `anyvac.clean`.
      selector:
        object:
    pin:
      name: Pin override
      description: >-
        Per-call override of the stored room pins — same shape as
        `anyvac.clean`.
      selector:
        object:
    settings:
      name: Settings
      description: >-
        Per-vacuum, per-pass mop/fan settings — same shape as `anyvac.clean`.
      selector:
        object:

goto:
  name: Pin & go
  description: >-
    Send a vacuum to a single point, either as a percentage of its own map
    image (default) or, with frame: "home", as a pixel position in the
    shared home frame (docs/40 Fáze 2) — the integration converts either
    one to the vacuum's own real coordinates.
  fields:
    entity_id:
      name: Vacuum
      description: Vacuum to send. Omit if `duid` is given instead.
      selector:
        entity:
          domain: vacuum
    duid:
      name: Vacuum (duid)
      description: Roborock device id, as an alternative to `entity_id`.
      selector:
        text:
    frame:
      name: Coordinate frame
      description: >-
        "robot" (default): x_pct/y_pct are percent of this vacuum's own map
        image. "home": x_home_px/y_home_px are pixels in the shared home
        frame — requires this vacuum to have a home-frame registration.
      default: robot
      selector:
        select:
          options:
            - robot
            - home
    x_pct:
      name: X (%)
      description: >-
        Target X, percent of the map image width. Used when frame is
        "robot" (the default).
      selector:
        number:
          min: 0
          max: 100
          step: 0.1
          unit_of_measurement: "%"
    y_pct:
      name: Y (%)
      description: >-
        Target Y, percent of the map image height. Used when frame is
        "robot" (the default).
      selector:
        number:
          min: 0
          max: 100
          step: 0.1
          unit_of_measurement: "%"
    x_home_px:
      name: X (home frame px)
      description: Target X in the shared home frame's pixel space. Used when frame is "home".
      selector:
        number:
          step: 0.1
    y_home_px:
      name: Y (home frame px)
      description: Target Y in the shared home frame's pixel space. Used when frame is "home".
      selector:
        number:
          step: 0.1

zone_clean:
  name: Zone clean
  description: >-
    Clean a rectangular zone, given as two opposite corners either in
    percent of the map image (default) or, with frame: "home", as pixel
    positions in the shared home frame (docs/40 Fáze 2).
  fields:
    entity_id:
      name: Vacuum
      description: Vacuum to send. Omit if `duid` is given instead.
      selector:
        entity:
          domain: vacuum
    duid:
      name: Vacuum (duid)
      description: Roborock device id, as an alternative to `entity_id`.
      selector:
        text:
    frame:
      name: Coordinate frame
      description: >-
        "robot" (default): the four *_pct fields are percent of this
        vacuum's own map image. "home": the four *_home_px fields are
        pixels in the shared home frame — requires this vacuum to have a
        home-frame registration.
      default: robot
      selector:
        select:
          options:
            - robot
            - home
    x1_pct:
      name: X1 (%)
      description: First corner X, percent of map image width. Used when frame is "robot".
      selector:
        number:
          min: 0
          max: 100
          step: 0.1
          unit_of_measurement: "%"
    y1_pct:
      name: Y1 (%)
      description: First corner Y, percent of map image height. Used when frame is "robot".
      selector:
        number:
          min: 0
          max: 100
          step: 0.1
          unit_of_measurement: "%"
    x2_pct:
      name: X2 (%)
      description: Opposite corner X, percent of map image width. Used when frame is "robot".
      selector:
        number:
          min: 0
          max: 100
          step: 0.1
          unit_of_measurement: "%"
    y2_pct:
      name: Y2 (%)
      description: Opposite corner Y, percent of map image height. Used when frame is "robot".
      selector:
        number:
          min: 0
          max: 100
          step: 0.1
          unit_of_measurement: "%"
    x1_home_px:
      name: X1 (home frame px)
      description: First corner X in the shared home frame's pixel space. Used when frame is "home".
      selector:
        number:
          step: 0.1
    y1_home_px:
      name: Y1 (home frame px)
      description: First corner Y in the shared home frame's pixel space. Used when frame is "home".
      selector:
        number:
          step: 0.1
    x2_home_px:
      name: X2 (home frame px)
      description: Opposite corner X in the shared home frame's pixel space. Used when frame is "home".
      selector:
        number:
          step: 0.1
    y2_home_px:
      name: Y2 (home frame px)
      description: Opposite corner Y in the shared home frame's pixel space. Used when frame is "home".
      selector:
        number:
          step: 0.1
    repeat:
      name: Repeat
      description: Number of passes over the zone.
      default: 1
      selector:
        number:
          min: 1
          max: 3
          step: 1

cancel:
  name: Cancel
  description: Tear down any running AnyVac job(s) and stop the vacuums involved.
  fields:
    return_to_base:
      name: Return to base
      description: Send the started vacuums home after cancelling.
      default: true
      selector:
        boolean:

select_rooms:
  name: Select rooms
  description: >-
    Change the shared room selection used by the card's dock (which rooms
    are queued to clean). Mainly for the card itself; rarely useful from
    automations.
  fields:
    rooms:
      name: Rooms
      description: Room names to apply `mode` to.
      example: '["Kitchen", "Bedroom"]'
      selector:
        object:
    mode:
      name: Mode
      description: How to apply `rooms` to the current selection.
      default: set
      selector:
        select:
          options:
            - set
            - add
            - remove
            - toggle
            - clear

pin_room:
  name: Pin room
  description: >-
    Override which vacuum cleans a room for a given pass (dry or wet),
    independently of the automatic load-balanced assignment. The pin is
    shared across every dashboard/browser and auto-clears once that pass
    of the room is actually cleaned.
  fields:
    room:
      name: Room
      description: Room name to pin, as configured in the Roborock app.
      required: true
      selector:
        text:
    kind:
      name: Pass
      description: >-
        Which pass this pin applies to. Omit together with `vacuum` to
        unpin the room entirely (both passes); omit `vacuum` alone with a
        `kind` set to unpin just that one pass.
      selector:
        select:
          options:
            - dry
            - wet
    vacuum:
      name: Vacuum
      description: >-
        Vacuum entity_id or duid to pin the room to. Leave empty to unpin
        (see `kind`).
      selector:
        entity:
          domain: vacuum

set_layers:
  name: Set map layers
  description: >-
    Set the shared dry/wet path visibility on the map (synced across every
    dashboard/browser).
  fields:
    dry:
      name: Dry path visible
      selector:
        boolean:
    wet:
      name: Wet path visible
      selector:
        boolean:

set_room_sequence:
  name: Set room sequence
  description: >-
    Replace the stored room cleaning order (used for sequence-aware ETA).
    Sends the complete ordered room list — position in the list is the
    1-based sequence number; this replaces the whole stored sequence, it
    does not merge.
  fields:
    rooms:
      name: Rooms
      description: >-
        Full ordered list of room names, in the order the Roborock app is
        configured to clean them.
      required: true
      example: '["Hall", "Kitchen", "Bedroom"]'
      selector:
        object:

reset_learning:
  name: Reset learning
  description: >-
    Clear learned clean-time estimates and/or coverage baselines, e.g.
    after moving furniture or resetting a robot's map. Without filters,
    clears everything for every known vacuum/room/kind.
  fields:
    duid:
      name: Vacuum (duid)
      description: Limit to a single vacuum's device id. Omit for all vacuums.
      selector:
        text:
    room:
      name: Room
      description: Limit to a single room name. Omit for all rooms.
      selector:
        text:
    kind:
      name: Pass
      description: Limit to dry or wet. Omit for both.
      selector:
        select:
          options:
            - dry
            - wet
    estimates:
      name: Clear time estimates
      default: true
      selector:
        boolean:
    baselines:
      name: Clear coverage baselines
      default: true
      selector:
        boolean:

dock_empty:
  name: Dock — empty dustbin
  description: Start or stop the dock's auto-empty (dust collection) cycle.
  fields:
    entity_id:
      name: Vacuum
      description: Vacuum whose dock to command. Omit if `duid` is given instead.
      selector:
        entity:
          domain: vacuum
    duid:
      name: Vacuum (duid)
      description: Roborock device id, as an alternative to `entity_id`.
      selector:
        text:
    action:
      name: Action
      description: >-
        Start the cycle (default) or stop a running one. The dock ends the cycle
        on its own; stop is for cutting it short.
      default: start
      selector:
        select:
          options:
            - start
            - stop

dock_wash:
  name: Dock — wash mop
  description: Start or stop the dock's mop-washing cycle.
  fields:
    entity_id:
      name: Vacuum
      description: Vacuum whose dock to command. Omit if `duid` is given instead.
      selector:
        entity:
          domain: vacuum
    duid:
      name: Vacuum (duid)
      description: Roborock device id, as an alternative to `entity_id`.
      selector:
        text:
    action:
      name: Action
      description: >-
        Start the cycle (default) or stop a running one. The dock ends the cycle
        on its own; stop is for cutting it short.
      default: start
      selector:
        select:
          options:
            - start
            - stop

dock_dry:
  name: Dock — dry mop
  description: Start or stop the dock's mop-drying cycle.
  fields:
    entity_id:
      name: Vacuum
      description: Vacuum whose dock to command. Omit if `duid` is given instead.
      selector:
        entity:
          domain: vacuum
    duid:
      name: Vacuum (duid)
      description: Roborock device id, as an alternative to `entity_id`.
      selector:
        text:
    action:
      name: Action
      description: >-
        Start the cycle (default) or stop a running one. The dock ends the cycle
        on its own; stop is for cutting it short.
      default: start
      selector:
        select:
          options:
            - start
            - stop

dock_pump:
  name: Dock — pump
  description: >-
    Drain the remaining water from the dock's cleaning sink (the manufacturer
    app's "Pump" action).
  fields:
    entity_id:
      name: Vacuum
      description: Vacuum whose dock to command. Omit if `duid` is given instead.
      selector:
        entity:
          domain: vacuum
    duid:
      name: Vacuum (duid)
      description: Roborock device id, as an alternative to `entity_id`.
      selector:
        text:

dock_self_clean:
  name: Dock — self-clean
  description: >-
    Flush the cleaning sink and the Fill&Drain element's built-in tank, and
    run a self-check on it. Only meaningful on docks with the Fill&Drain
    plumbing accessory installed.
  fields:
    entity_id:
      name: Vacuum
      description: Vacuum whose dock to command. Omit if `duid` is given instead.
      selector:
        entity:
          domain: vacuum
    duid:
      name: Vacuum (duid)
      description: Roborock device id, as an alternative to `entity_id`.
      selector:
        text:

snapshot_map_as_floorplan:
  name: Snapshot map as floorplan
  description: >-
    Save a map image entity's current picture as a static file under
    config/www/anyvac/ and return its /local/ URL. Used by the card's Maps
    tab to turn one vacuum's own map into the shared floorplan image for
    merged mode, without manually saving/uploading a file. With frame:
    "home" (docs/40 Fáze 2), renders a composite of every vacuum registered
    into the shared home frame instead — image_entity is then unused.
  fields:
    image_entity:
      name: Image entity
      description: >-
        The map image entity to snapshot (e.g. image.s6_kitchen_map_0).
        Required unless frame is "home".
      selector:
        entity:
          domain: image
    frame:
      name: Coordinate frame
      description: >-
        Leave unset to snapshot one vacuum's image_entity (default). Set to
        "home" for a composite of every vacuum in the shared home frame.
      selector:
        select:
          options:
            - home
    frame_id:
      name: Home frame id
      description: >-
        Only used with frame: "home". Picks a specific home frame by id
        (from the 'home_frame' sensor attribute) — omit to use the frame
        with the most registered vacuums.
      selector:
        text:
    name:
      name: Name
      description: >-
        Label used to build the output filename (slugified). Defaults to
        the image entity's object id, or "home_frame" with frame: "home".
      selector:
        text:
    fiducials:
      name: Embed fiducial markers
      description: >-
        docs/40 §5.A.2, frame: "home" only. Embeds 4 invisible markers in
        the snapshot's padding border so a copy of the file that's later
        cropped/resized/rotated in an external editor can resolve its exact
        scale, offset and rotation via anyvac.detect_floorplan_fiducials —
        with no clicking. Only works if the file's alpha channel survives
        the edit (stays PNG, never flattened/re-exported as JPEG). Off by
        default — invisible either way, but skips the extra drawing step
        when you don't need it.
      default: false
      selector:
        boolean:

export_map_guide:
  name: Export map guide layers
  description: >-
    Draw room boundaries and the last dry/wet path as separate transparent
    PNGs, cropped to the same box as `anyvac.snapshot_map_as_floorplan`. Used
    by the card's Maps tab as a tracing aid for building a custom floorplan by
    hand (e.g. in GIMP) — the gaps inside the drawn path are where furniture
    stands. Draws only; never changes card config. With frame: "home" (docs/40
    Fáze 2), draws every vacuum in the shared home frame on one canvas, with
    real room outlines instead of one vacuum's rectangles — image_entity is
    then unused.
  fields:
    image_entity:
      name: Image entity
      description: >-
        The map image entity whose geometry to export (e.g.
        image.s6_kitchen_map_0). Same entity `anyvac.snapshot_map_as_floorplan`
        would use for this vacuum. Required unless frame is "home".
      selector:
        entity:
          domain: image
    frame:
      name: Coordinate frame
      description: >-
        Leave unset to export one vacuum's own geometry (default). Set to
        "home" to export every vacuum in the shared home frame at once.
      selector:
        select:
          options:
            - home
    frame_id:
      name: Home frame id
      description: >-
        Only used with frame: "home". Picks a specific home frame by id —
        omit to use the frame with the most registered vacuums.
      selector:
        text:
    name:
      name: Name
      description: >-
        Label used to build the output filenames (slugified). Defaults to
        the image entity's object id, or "home_frame" with frame: "home".
      selector:
        text:
    layers:
      name: Layers
      description: >-
        Which guide layers to produce. Any of `rooms`, `dry`, `wet`.
      example: '["rooms", "dry", "wet"]'
      selector:
        object:
    labels:
      name: Room name labels
      description: >-
        Write each room's name into the `rooms` layer near its top-left
        corner.
      default: true
      selector:
        boolean:
    stroke_mm:
      name: Stroke width
      description: >-
        Width of the drawn dry/wet path, in millimetres — should match the
        vacuum's real footprint so the negative space inside the path lines
        up with actual furniture. Converted to pixels using this vacuum's
        own map calibration (or the home frame's, with frame: "home");
        falls back to a fixed pixel width when calibration is unavailable.
      default: 300
      selector:
        number:
          min: 50
          max: 600
          unit_of_measurement: mm
    crop:
      name: Crop override
      description: >-
        Force a specific `{x0, y0, x1, y1}` crop box — rendered-image pixel
        space normally, or home-frame pixel space with frame: "home" —
        instead of the one computed automatically. Use this to match guide
        layers to an EXISTING older floorplan whose crop has since shifted
        (e.g. after a remap).
      example: '{"x0": 412, "y0": 384, "x1": 764, "y1": 1692}'
      selector:
        object:

dump_raw_map:
  name: Dump raw map (debug)
  description: >-
    DEBUG/DIAGNOSTIC ONLY (docs/40 Fáze 0). Writes the vacuum's raw Roborock
    map bytes to config/www/anyvac/debug/ for the offline home-frame
    registration probe. Not used by the card; no behaviour change to anything
    else. Fails if raw map data is not available yet for this vacuum.
  fields:
    entity_id:
      name: Vacuum
      description: Vacuum whose raw map to dump. Omit if `duid` is given instead.
      selector:
        entity:
          domain: vacuum
    duid:
      name: Vacuum (duid)
      description: Roborock device id, as an alternative to `entity_id`.
      selector:
        text:
    name:
      name: Name
      description: >-
        Label used to build the output filename (slugified). Defaults to
        the vacuum entity's object id.
      selector:
        text:

snap_wall_corner:
  name: Snap point to nearest wall corner
  description: >-
    docs/40 §5.B. Given a point in home-frame pixel space, returns the
    nearest wall-corner vertex found in that frame's own wall mask — used by
    the card's foreign-floorplan (photo/drawing) N-point calibration to snap
    the home-frame side of a click pair onto an exact architectural point
    instead of trusting the click's raw pixel position. Returns the point
    unchanged (snapped: false) if the frame has no wall data yet.
  fields:
    frame_id:
      name: Home frame id
      description: >-
        Picks a specific home frame by id (from the 'home_frame' sensor
        attribute) — omit to use the frame with the most registered vacuums.
      selector:
        text:
    x_home_px:
      name: X (home px)
      description: The point's X coordinate in home-frame pixel space.
      required: true
      selector:
        number:
    y_home_px:
      name: Y (home px)
      description: The point's Y coordinate in home-frame pixel space.
      required: true
      selector:
        number:

detect_floorplan_fiducials:
  name: Detect floorplan fiducial markers
  description: >-
    docs/40 §5.A.2. Scans a floorplan file for the invisible fiducial
    markers anyvac.snapshot_map_as_floorplan embedded when called with
    fiducials: true, and returns home_anchors pairs in exactly the shape
    image_base.home_anchors already stores (docs/40 §5.B) — the card writes
    them straight into config, calibrated with zero clicks. Requires at
    least 2 of the 4 markers to still be present and to have kept their
    alpha channel intact (a file re-exported as JPEG, or flattened in an
    editor, loses them).
  fields:
    path:
      name: Floorplan file
      description: >-
        The /local/anyvac/... file to scan — normally the same file the
        user has since edited externally after it was first saved by
        anyvac.snapshot_map_as_floorplan (fiducials: true).
      required: true
      selector:
        text:
    fiducials:
      name: Known marker positions
      description: >-
        The exact `fiducials` list anyvac.snapshot_map_as_floorplan
        returned when it embedded the markers — passed through unchanged,
        never re-derived.
      required: true
      example: '[{"id": "tl", "home_px": {"x": 12, "y": 8}}]'
      selector:
        object:
